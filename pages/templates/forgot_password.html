{{define "forgot_password"}}
{{template "page-head" .}}

<main class="auth-page">
  <div class="auth-card">
    <h1 class="auth-title">{{.SiteName}}</h1>
    <h2 class="auth-subtitle">Reset Password</h2>

    {{if .Flash}}
    <div class="flash flash--error" role="alert">{{.Flash}}</div>
    {{end}}

    <p class="auth-intro">Enter the email address associated with your account and we'll send you a reset link.</p>

    <form method="POST" action="/forgot-password" class="auth-form" novalidate>
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">

      <div class="field">
        <label for="email">Email address</label>
        <input
          type="email"
          id="email"
          name="email"
          autocomplete="email"
          autofocus
          required
        >
      </div>

      <button type="submit" class="btn btn--primary">Send Reset Link</button>
    </form>

    <p class="auth-footer">
      Remembered it? <a href="/login">Sign in</a>
    </p>
  </div>
</main>

{{template "page-foot" .}}
{{end}}
