{{define "reset_password"}}
{{template "page-head" .}}

<main class="auth-page">
  <div class="auth-card">
    <h1 class="auth-title">{{.SiteName}}</h1>
    <h2 class="auth-subtitle">Choose a New Password</h2>

    {{if .Flash}}
    <div class="flash flash--error" role="alert">{{.Flash}}</div>
    {{end}}

    <form method="POST" action="/reset-password" class="auth-form" novalidate>
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <input type="hidden" name="token" value="{{.Token}}">

      <div class="field">
        <label for="password">New password</label>
        <input
          type="password"
          id="password"
          name="password"
          autocomplete="new-password"
          minlength="8"
          autofocus
          required
        >
        <p class="field-hint">At least 8 characters.</p>
      </div>

      <div class="field">
        <label for="password_confirm">Confirm new password</label>
        <input
          type="password"
          id="password_confirm"
          name="password_confirm"
          autocomplete="new-password"
          minlength="8"
          required
        >
      </div>

      <button type="submit" class="btn btn--primary">Set New Password</button>
    </form>
  </div>
</main>

{{template "page-foot" .}}
{{end}}
